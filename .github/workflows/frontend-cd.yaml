name: Frontend Continuous Deployment

on:
push:
branches:
- main
paths:
- 'starter/frontend/**'
- '.github/workflows/frontend-cd.yaml'
workflow_dispatch:

env:
AWS_REGION: us-east-1
ECR_REPOSITORY: 759438844561.dkr.ecr.us-east-1.amazonaws.com/frontend
EKS_CLUSTER: cluster
REACT_APP_MOVIE_API_URL: http://localhost:5000

jobs:
lint:
runs-on: ubuntu-latest
defaults:
run:
working-directory: starter/frontend

```
steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: "18"
      cache: npm
      cache-dependency-path: starter/frontend/package-lock.json

  - name: Install dependencies
    run: npm ci

  - name: Run lint
    run: npm run lint
```

test:
runs-on: ubuntu-latest
defaults:
run:
working-directory: starter/frontend

```
steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: "18"
      cache: npm
      cache-dependency-path: starter/frontend/package-lock.json

  - name: Install dependencies
    run: npm ci

  - name: Run tests
    run: CI=true npm test
```

build:
needs:
- lint
- test
runs-on: ubuntu-latest
defaults:
run:
working-directory: starter/frontend

```
steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Configure AWS credentials
    uses: aws-actions/configure-aws-credentials@v4
    with:
      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      aws-region: ${{ env.AWS_REGION }}

  - name: Login to Amazon ECR
    uses: aws-actions/amazon-ecr-login@v2

  - name: Build Docker image
    run: |
      docker build \
        --build-arg REACT_APP_MOVIE_API_URL="${REACT_APP_MOVIE_API_URL}" \
        -t "${ECR_REPOSITORY}:${GITHUB_SHA}" \
        .

  - name: Push Docker image
    run: |
      docker push "${ECR_REPOSITORY}:${GITHUB_SHA}"
```

deploy:
needs: build
runs-on: ubuntu-latest

```
steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Configure AWS credentials
    uses: aws-actions/configure-aws-credentials@v4
    with:
      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      aws-region: ${{ env.AWS_REGION }}

  - name: Update kubeconfig
    run: |
      aws eks update-kubeconfig \
        --name "${EKS_CLUSTER}" \
        --region "${AWS_REGION}"

  - name: Deploy frontend
    working-directory: starter/frontend/k8s
    run: |
      kustomize edit set image frontend="${ECR_REPOSITORY}:${GITHUB_SHA}"
      kustomize build | kubectl apply -f -
```

